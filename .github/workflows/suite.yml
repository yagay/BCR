name: BCR Suite combined debug
on:
  push:
    branches:
      - feature/bcr-gui-suite
  workflow_dispatch:
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out BCR and BCR-GUI submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: external/bcr-gui/package-lock.json
      - name: Build unchanged BCR-GUI web bundle
        working-directory: external/bcr-gui
        run: |
          npm ci
          python3 ../../integrations/bcrgui-bridge/apply_navigation_overlay.py
          npm run build
          npx cap sync android
      - name: Apply AGP compatibility fix to installed Capacitor 6 packages
        shell: bash
        run: |
          # Never modify the pinned BCR-GUI source or either upstream repository.
          # AGP 9 rejects a legacy ProGuard default filename used by Capacitor 6.
          find external/bcr-gui/node_modules -type f -name build.gradle -print0 |
            xargs -0 -r sed -i 's/proguard-android[.]txt/proguard-android-optimize.txt/g'
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Assemble single combined APK
        run: ./gradlew --no-daemon --stacktrace --dependency-verification lenient -PsuiteEnabled=true :app:assembleDebug -x :app:archive
      - name: Verify both BCR and GUI are packaged
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -1)"
          test -n "$apk"
          for path in META-INF/xposed/module.prop META-INF/xposed/scope.list META-INF/xposed/java_init.list assets/public/index.html assets/capacitor.config.json assets/capacitor.plugins.json; do
            unzip -Z1 "$apk" | grep -Fx "$path"
          done
          unzip -p "$apk" META-INF/xposed/scope.list | grep -Fx system
          # The BCR Settings launcher must be disabled in the Suite build,
          # leaving the GUI activity as the only launcher.
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk" | grep -F "com.chiller3.bcr.suite.SuiteGuiActivity"
          unzip -p "$apk" assets/public/main.js >/dev/null 2>&1 || true
      - name: Upload BCR Suite Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BCR-Suite-Call-History-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
